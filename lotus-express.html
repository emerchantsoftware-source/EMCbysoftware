<style>
  :root{--ink:#0E211A;--panel:#15332A;--paper:#F4F7F2;--paper-dim:#E6ECE1;--green:#2FBE73;--lime:#9AD84B;--line:rgba(14,33,26,0.12);--line-dark:rgba(244,247,242,0.14);--ink-fixed:#0E211A;--paper-fixed:#F4F7F2;--muted:#6B7268;--header-bg:rgba(244,247,242,0.85);}
  [data-theme="dark"]{--ink:#E9F2EC;--paper:#0F1D17;--paper-dim:#182A21;--line:rgba(233,242,236,0.14);--muted:#93A398;--header-bg:rgba(15,29,23,0.85);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;overflow-x:hidden;}
  .mono{font-family:'IBM Plex Mono','IBM Plex Sans Thai',monospace;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,190,115,.55);}70%{box-shadow:0 0 0 9px rgba(47,190,115,0);}100%{box-shadow:0 0 0 0 rgba(47,190,115,0);}}

  .hero{background:radial-gradient(rgba(244,247,242,0.05) 1px,transparent 1.4px) 0 0/26px 26px,var(--ink-fixed);color:var(--paper-fixed);padding:7vw 6vw 5vw;position:relative;overflow:hidden;isolation:isolate;}
  .hero::before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(70px);z-index:-1;opacity:.5;background:radial-gradient(circle,var(--green),transparent 70%);top:-200px;right:-100px;}
  .crumb{font-size:13px;color:var(--green);display:flex;align-items:center;gap:10px;margin-bottom:18px;opacity:0;animation:fadeUp .7s ease .1s forwards;}
  .crumb::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2.4s ease-in-out infinite;}
  .crumb a{color:inherit;text-decoration:none;} .crumb a:hover{text-decoration:underline;}
  .hero h1{font-size:clamp(30px,4vw,48px);font-weight:700;line-height:1.4;letter-spacing:-.01em;opacity:0;animation:fadeUp .7s ease .22s forwards;}
  .hero p{margin-top:12px;font-size:16px;color:rgba(244,247,242,.72);max-width:60ch;opacity:0;animation:fadeUp .7s ease .34s forwards;}
  .stats{display:flex;gap:40px;margin-top:34px;flex-wrap:wrap;opacity:0;animation:fadeUp .7s ease .46s forwards;}
  .stat .num{font-size:32px;color:var(--lime);line-height:1;} .stat .lbl{font-size:13px;color:rgba(244,247,242,.6);margin-top:6px;}

  section{padding:56px 6vw 80px;background:var(--paper-dim);}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
  .tab{font:inherit;font-size:14px;font-weight:600;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s;}
  .tab small{font-weight:400;color:var(--muted);margin-left:6px;}
  .tab[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--ink-fixed);} .tab[aria-selected="true"] small{color:var(--ink-fixed);}
  .tab:disabled{opacity:.5;cursor:not-allowed;border-style:dashed;}
  .tab:not(:disabled):not([aria-selected="true"]):hover{border-color:var(--green);}
  .tab:focus-visible,.tools input:focus-visible,.tools select:focus-visible,.more:focus-visible{outline:2px solid var(--green);outline-offset:2px;}

  .section-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .section-head h2{font-size:28px;font-weight:700;letter-spacing:-.01em;} .count{font-size:13px;color:var(--muted);}
  .tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .tools input,.tools select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:11px 18px;}
  .tools input{flex:1 1 280px;min-width:0;} .tools input::placeholder{color:var(--muted);}
  .tools input:focus,.tools select:focus{border-color:var(--green);}

  .table-wrap{border:1px solid var(--line);border-radius:18px;overflow:auto;background:var(--paper);max-height:72vh;}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px;}
  th{position:sticky;top:0;background:var(--paper);text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:14px 20px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:0;} tbody tr:hover td{background:var(--paper-dim);}
  td.no{color:var(--green);font-weight:500;white-space:nowrap;} td.hrs{white-space:nowrap;}
  mark{background:rgba(154,216,75,.4);color:inherit;border-radius:3px;padding:0 1px;}
  .tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;}
  .tag.h24{color:var(--green);border-color:var(--green);}
  .empty{padding:48px 20px;text-align:center;color:var(--muted);display:none;}
  .more{display:none;margin:22px auto 0;font:inherit;font-size:14px;font-weight:600;padding:11px 24px;border-radius:999px;border:1px solid var(--green);background:transparent;color:var(--green);cursor:pointer;}
  .more:hover{background:var(--green);color:var(--ink-fixed);}
  @media (max-width:640px){th,td{padding:12px 14px;}}
</style>

const PAGE=100; let shown=PAGE, list=DATA;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nodes=[...new Set(DATA.map(r=>r[2]).filter(Boolean))].sort();
$('node').insertAdjacentHTML('beforeend',nodes.map(n=>`<option>${esc(n)}</option>`).join(''));
$('s-total').textContent=DATA.length.toLocaleString();
$('s-24').textContent=DATA.filter(r=>r[4]==='24 Hours').length.toLocaleString();
$('s-node').textContent=nodes.length;

function hl(t,q){
  if(!q) return esc(t);
  const lt=t.toLowerCase(); let out='',i=0,j;
  while((j=lt.indexOf(q,i))>-1){ out+=esc(t.slice(i,j))+'<mark>'+esc(t.slice(j,j+q.length))+'</mark>'; i=j+q.length; }
  return out+esc(t.slice(i));
}
function render(){
  const q=$('q').value.trim().toLowerCase(), n=$('node').value, g=$('range').value;
  list=DATA.filter(r=>(!n||r[2]===n)&&(!g||r[4]===g)&&(!q||r.join(' ').toLowerCase().includes(q)));
  const rows=list.slice(0,shown);
  $('tb').innerHTML=rows.map(r=>`<tr><td class="no mono">${hl(r[0],q)}</td><td>${hl(r[1],q)}</td><td>${hl(r[2],q)}</td><td class="hrs mono">${hl(r[3],q)||'-'}</td><td>${r[4]?`<span class="tag ${r[4]==='24 Hours'?'h24':''}">${esc(r[4])}</span>`:'-'}</td></tr>`).join('');
  $('empty').style.display=list.length?'none':'block';
  $('count').textContent=`แสดง ${rows.length.toLocaleString()} จาก ${list.length.toLocaleString()} สาขา`;
  const left=list.length-rows.length, b=$('more');
  b.style.display=left>0?'block':'none'; b.textContent=`แสดงเพิ่ม (เหลืออีก ${left.toLocaleString()} สาขา)`;
}
['q','node','range'].forEach(id=>$(id).addEventListener('input',()=>{shown=PAGE;render();}));
$('more').addEventListener('click',()=>{shown+=PAGE*2;render();});
render();
</script>
