<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helpdesk Office 3D</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E211A;--panel:#15332A;--paper:#F4F7F2;--green:#2FBE73;--lime:#9AD84B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans Thai',sans-serif;overflow:hidden}
canvas{display:block;touch-action:none;cursor:grab}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px}.brand span{color:var(--green);font-family:'IBM Plex Mono',monospace}
.sub{font-size:12px;color:#93A398;margin-top:2px}

/* ปุ่ม 3 ปุ่ม: ขนาด/ความสูง/ไอคอน/ตัวอักษรเท่ากันหมด */
.btns{pointer-events:auto;display:grid;grid-template-columns:repeat(3,142px);gap:8px;margin-left:auto}
.pill{box-sizing:border-box;margin:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;
 height:38px;padding:0 14px;white-space:nowrap;cursor:pointer;text-decoration:none;
 font:600 13px/1.25 'IBM Plex Sans Thai',sans-serif;color:var(--paper);background:var(--panel);
 border:1px solid rgba(244,247,242,.2);border-radius:999px;-webkit-appearance:none;appearance:none;transition:border-color .15s,background .15s}
.pill svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill:hover{border-color:var(--green)}
.pill.on{background:var(--green);color:var(--ink);border-color:var(--green)}
@media(max-width:700px){.btns{width:100%;grid-template-columns:repeat(3,1fr)}.pill{padding:0 6px;font-size:12px;gap:5px}}

#views{position:fixed;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(62vw,560px)}
#views .pill{height:34px;padding:0 12px;font-size:12px}
@media(max-width:700px){#views{left:14px;right:14px;max-width:none;bottom:calc(64px + env(safe-area-inset-bottom,0px));justify-content:flex-start}}
#legend{position:fixed;left:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;font:12px 'IBM Plex Mono',monospace;flex-wrap:wrap;background:rgba(14,33,26,.8);padding:8px 12px;border-radius:12px;border:1px solid rgba(244,247,242,.14)}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.tag{position:fixed;left:0;top:0;pointer-events:none;font:600 11px 'IBM Plex Sans Thai',sans-serif;background:rgba(14,33,26,.85);border:1px solid rgba(244,247,242,.2);padding:1px 8px 1px 6px;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:5px;transform:translate(-50%,-100%)}
.tag i{width:7px;height:7px;border-radius:50%}
.bub{position:fixed;left:0;top:0;pointer-events:none;background:var(--paper);color:var(--ink);font:500 13px 'IBM Plex Sans Thai',sans-serif;padding:6px 11px;border-radius:14px;max-width:190px;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.bub::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--green);padding:6px 10px;border-radius:10px;font-size:12px;display:none;z-index:5}
#tip b{display:block;font-size:13px}
</style></head><body>
<div id="hud">
 <div><div class="brand"><span>//</span> Helpdesk Office 3D</div><div class="sub">ลากโต๊ะเพื่อย้ายที่นั่ง · ลากพื้นที่ว่างเพื่อหมุนมุมมอง · scroll เพื่อซูม</div></div>
 <div class="btns">
  <a class="pill" href="index.html#teams" target="_top"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg><span>กลับหน้า Index</span></a>
  <button id="bChat" class="pill on" type="button"><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span>บทสนทนา</span></button>
  <button id="bReset" class="pill" type="button"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span>รีเซ็ตที่นั่ง</span></button>
 </div>
</div>
<div id="views"><button class="pill" type="button" data-v="all">ภาพรวม</button><button class="pill" type="button" data-v="top">มุมบน</button><button class="pill" type="button" data-v="eye">ระดับสายตา</button><button class="pill" type="button" data-v="door">ฝั่งประตู</button><button id="bSnd" class="pill" type="button">🔊 เสียง</button></div>
<div id="legend"></div><div id="tip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="office-3d.js"></script>
</body></html>
