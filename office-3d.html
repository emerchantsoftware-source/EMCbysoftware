<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helpdesk Office 3D · Valley Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--wood:#5a3418;--dark:#3b2616;--edge:#8b4513;--paper:#fbe3b0;--paper2:#f1c27d;--ink:#4a2208;--gold:#ffd35c;--leaf:#6fbf4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#9bd4f5;color:var(--ink);font-family:'Mali','Press Start 2P',sans-serif;overflow:hidden}
canvas{display:block;touch-action:none;cursor:grab;image-rendering:pixelated;image-rendering:crisp-edges}
/* กรอบไม้สไตล์ Stardew (ขอบพิกเซลด้วย box-shadow) */
.box{background:var(--paper);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px #ffefc8,0 0 0 3px var(--dark),0 5px 0 3px var(--dark)}
#hud{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;pointer-events:none;flex-wrap:wrap}
.sign{padding:8px 14px 9px;max-width:min(430px,100%)}
.brand{font:400 12px/1.5 'Press Start 2P',monospace;color:var(--wood)}.brand span{color:#c0492b}
.sub{font-size:12px;font-weight:500;margin-top:4px;line-height:1.35}
#clk{display:inline-block;margin-top:6px;padding:1px 9px;background:var(--wood);color:var(--gold);border-radius:2px;font:400 11px/1.7 'Press Start 2P',monospace}
.btns{pointer-events:auto;display:grid;grid-template-columns:repeat(3,142px);gap:12px;margin-left:auto;margin-top:2px}
.pill{box-sizing:border-box;margin:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 12px;white-space:nowrap;cursor:pointer;text-decoration:none;
 font:700 13px/1.25 'Mali',sans-serif;color:var(--ink);background:var(--paper2);border:3px solid var(--edge);border-radius:3px;-webkit-appearance:none;appearance:none;
 box-shadow:inset 0 0 0 2px #ffdca0,0 0 0 3px var(--dark),0 4px 0 3px var(--dark);transition:transform .08s}
.pill svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter}
.pill:hover{background:#f8d391}
.pill:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #ffdca0,0 0 0 3px var(--dark),0 1px 0 3px var(--dark)}
.pill.on{background:var(--gold);border-color:#b9731c}
@media(max-width:700px){.btns{width:100%;grid-template-columns:repeat(3,1fr);gap:10px}.pill{padding:0 4px;font-size:12px;gap:4px}}
#views{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:min(62vw,580px)}
#views .pill{height:34px;padding:0 11px;font-size:12px}
@media(max-width:700px){#views{left:16px;right:16px;max-width:none;bottom:calc(76px + env(safe-area-inset-bottom,0px));justify-content:flex-start}}
/* แถบทีม = แถบ inventory */
#legend{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;font:600 12px 'Mali',sans-serif;flex-wrap:wrap;padding:7px 12px;background:var(--paper);border:3px solid var(--edge);box-shadow:inset 0 0 0 3px #ffefc8,0 0 0 3px var(--dark),0 4px 0 3px var(--dark)}
#legend i{display:inline-block;width:11px;height:11px;margin-right:5px;border:2px solid var(--dark);vertical-align:-1px}
/* ป้ายชื่อ + ฟองคำพูดแบบกล่องข้อความ */
.tag{position:fixed;left:0;top:0;pointer-events:none;font:700 11px 'Mali',sans-serif;color:var(--ink);background:var(--paper);border:2px solid var(--edge);box-shadow:0 0 0 2px var(--dark);padding:0 7px 0 5px;white-space:nowrap;display:flex;align-items:center;gap:5px;transform:translate(-50%,-100%)}
.tag i{width:8px;height:8px;border:1px solid var(--dark)}
.bub{position:fixed;left:0;top:0;pointer-events:none;background:var(--paper);color:var(--ink);font:600 13px/1.3 'Mali',sans-serif;padding:6px 11px;max-width:190px;border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #ffefc8,0 0 0 3px var(--dark);opacity:0;transition:opacity .2s}
.bub::after{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-5px;width:10px;height:8px;background:var(--paper);border:3px solid var(--edge);border-top:0;box-shadow:0 3px 0 0 var(--dark)}
#tip{position:fixed;pointer-events:none;background:var(--paper);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--dark);padding:6px 10px;font-size:12px;font-weight:600;display:none;z-index:5}
#tip b{display:block;font-size:13px}
</style></head><body>
<div id="hud">
 <div class="box sign"><div class="brand"><span>★</span> Helpdesk Office</div><div class="sub">ลากโต๊ะเพื่อย้ายที่นั่ง · ลากพื้นที่ว่างเพื่อหมุนมุมมอง · scroll เพื่อซูม</div><div id="clk"></div></div>
 <div class="btns">
  <a class="pill" href="index.html#teams" target="_top"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg><span>กลับหน้า Index</span></a>
  <button id="bChat" class="pill on" type="button"><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span>บทสนทนา</span></button>
  <button id="bReset" class="pill" type="button"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span>รีเซ็ตที่นั่ง</span></button>
 </div>
</div>
<div id="views"><button class="pill" type="button" data-v="all">ภาพรวม</button><button class="pill" type="button" data-v="top">มุมบน</button><button class="pill" type="button" data-v="eye">ระดับสายตา</button><button class="pill" type="button" data-v="door">ฝั่งประตู</button><button id="bFps" class="pill" type="button">🚶 มุม FPS</button><button id="bSnd" class="pill" type="button">🔊 เสียง</button></div>
<div id="legend"></div><div id="tip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="office-3d.js"></script>
</body></html>
